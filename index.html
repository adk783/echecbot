<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess vs Bot</title>
  </head>
  <body>
    <main class="app">
      <h1>Chess vs Bot</h1>
      <div class="controls">
        <label>Level <select id="level"></select></label>
        <label>
          Play as
          <select id="color">
            <option value="w">White</option>
            <option value="b">Black</option>
          </select>
        </label>
        <button id="new-game" type="button">New game</button>
      </div>
      <section class="table" aria-label="Game">
        <div id="bot-card" class="player-card bot-card">
          <div class="avatar-frame">
            <img class="avatar" alt="Bot" width="72" height="72" />
          </div>
          <div class="player-info">
            <span class="player-name">Bot</span>
            <span class="player-level"></span>
          </div>
          <p class="bubble" aria-live="polite" hidden></p>
        </div>
        <div id="board" class="board"></div>
        <div id="win-chance" class="win-chance is-pending">
          <div class="win-legend">
            <span>You <strong class="label-win">...</strong></span>
            <span>Draw <strong class="label-draw">...</strong></span>
            <span>Bot <strong class="label-loss">...</strong></span>
          </div>
          <div class="win-bar" aria-hidden="true">
            <span class="segment segment-win"></span>
            <span class="segment segment-draw"></span>
            <span class="segment segment-loss"></span>
          </div>
        </div>
        <div class="player-card you-card">
          <div class="avatar-frame you-avatar" aria-hidden="true">You</div>
          <div class="player-info">
            <span class="player-name">You</span>
          </div>
        </div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
